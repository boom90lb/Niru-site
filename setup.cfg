[flake8]
max-line-length = 99
extend-ignore = E203, E501, W503
# The generator pins BLAS threads before numpy loads, so its imports follow code.
per-file-ignores =
    scripts/spectral-certificate.py: E402
    scripts/spectral-history/*.py: E402
exclude =
    .git,
    .venv,
    .venv-qa,
    dist,
    node_modules

[tool:pytest]
addopts = -q --maxfail=1 --strict-config --strict-markers
minversion = 9.1
testpaths = tests/python
pythonpath = .
