name: Deployed smoke

on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS origin to verify
        required: true
        default: https://niru.ml
        type: string
      expect_preview_noindex:
        description: Require noindex on every route
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deployed-smoke-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.NIRU_DEPLOYED_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Check deployed response headers
        env:
          BASE_URL: ${{ inputs.base_url || 'https://niru.ml' }}
          EXPECT_PREVIEW_NOINDEX: ${{ inputs.expect_preview_noindex || 'false' }}
        run: |
          args=(--base-url "$BASE_URL")
          if [[ "$EXPECT_PREVIEW_NOINDEX" == "true" ]]; then
            args+=(--expect-preview-noindex)
          fi
          python scripts/check_deployed_headers.py "${args[@]}"
